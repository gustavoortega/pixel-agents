# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentPresent'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        # Context window
        - $ref: '#/components/schemas/AgentContextUsage'
        # Model look
        - $ref: '#/components/schemas/AgentModel'
        # Session title
        - $ref: '#/components/schemas/AgentSessionTitle'
        # Session signals
        - $ref: '#/components/schemas/AgentCache'
        - $ref: '#/components/schemas/AgentMode'
        - $ref: '#/components/schemas/AgentShells'
        # Tripwires
        - $ref: '#/components/schemas/AgentTripwire'
        - $ref: '#/components/schemas/AgentTripwireClear'
        # Roster + XP
        - $ref: '#/components/schemas/AgentRoster'
        - $ref: '#/components/schemas/RosterEvent'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/HooksStatus'
        - $ref: '#/components/schemas/HooksConsentRequest'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/AreaMappingsLoaded'
        - $ref: '#/components/schemas/WorkspaceFolders'
        # Token ledger
        - $ref: '#/components/schemas/TokenUsage'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetGhostHeadlessAgents'
        - $ref: '#/components/schemas/SetShowModelFlair'
        - $ref: '#/components/schemas/SetCozyLighting'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/HooksConsentResponse'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/SaveAreaMappings'
        - $ref: '#/components/schemas/SetShowAreas'
        - $ref: '#/components/schemas/RequestDiagnostics'
        - $ref: '#/components/schemas/AckTripwire'
        - $ref: '#/components/schemas/SetTokenBudgets'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        folderName:
          type: string
        isExternal:
          type: boolean
        palette:
          type: integer
          description: Server-assigned character palette index.
        hueShift:
          type: integer
          description: Server-assigned hue shift in degrees (0-360).

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: >-
        Activity state of an agent. "active" = working (typing, monitor on).
        "waiting" = the turn is over and the agent awaits the user (bubble).
        "idle" = not working and nothing to announce: also what an agent whose
        state is unknown or stale reads as, so it never renders as working.
      type: string
      enum: [active, waiting, idle]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean
        isTeammateSpawn:
          type: boolean
          description: >-
            True when this spawn tool call carries a name, making the spawn a
            Teammate-to-be. The office must not create a Subtask sub-character
            for it — a teammate character will represent the spawn instead.

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: >-
        Sub-agent (e.g. Task) started a tool. A workflow agent's parentToolId is
        synthetic (`wf:<runId>:<agentId>`, no parent tool on the lead) and every
        one of its starts carries `label` and `group`, so a client that missed
        the first one can still name the helper it creates.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string
        label:
          description: Workflow agent label from the run journal, single-spaced, without control or format characters. Absent for other sub-agents.
          type: string
          maxLength: 60
        group:
          description: Workflow phase of the agent, single-spaced, without control or format characters. Absent when the journal has none.
          type: string
          maxLength: 40

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentPresent:
      description: >-
        A workflow agent is live under its lead (`parentToolId` is its synthetic
        `wf:<runId>:<agentId>`). Sent when the server starts watching it and again
        on every handshake (webviewReady), so its helper shows before, or
        without, any tool call.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentPresent
        id:
          type: integer
        parentToolId:
          type: string
        label:
          description: Workflow agent label from the run journal, single-spaced, without control or format characters.
          type: string
          maxLength: 60
        group:
          description: Workflow phase of the agent, single-spaced, without control or format characters. Absent when the journal has none.
          type: string
          maxLength: 40

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentContextUsage:
      description: |
        How much of the agent's context window is in use, as of its most recent
        turn. A snapshot, NOT a running total: it falls when the session
        compacts or clears. `maxContextTokens` is the runtime's best estimate of
        the window size — transcripts don't state it, so it starts at the
        default and widens (never shrinks) once a larger context is observed.
        Sent for every agent, including leads and teammates; sub-agents have no
        session of their own and never report it.
      type: object
      additionalProperties: false
      required: [type, id, contextTokens, maxContextTokens]
      properties:
        type:
          const: agentContextUsage
        id:
          type: integer
        contextTokens:
          type: integer
        maxContextTokens:
          type: integer

    AgentModel:
      description: |
        The model the agent's newest main-chain turn ran on, and its tier (1 smallest
        to 4 largest) when the provider can place it. Drives the office's rarity look.
        Sent when either changes, and on reconnect for every agent. `model` omitted
        means no model is known yet; `tier` omitted means the provider cannot place
        the model (unknown means no flair, never tier 1). Sub-agents have no session
        of their own and never receive one.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentModel
        id:
          type: integer
        model:
          type: string
        tier:
          type: integer
          minimum: 1
          maximum: 4

    AgentSessionTitle:
      description: |
        The session's display title: the name the user gave it, else the one the
        CLI generated. `title` omitted means this agent has no known title and
        the label shows its folder; it is sent when a known title is cleared
        (the agent moved to another transcript) and on reconnect for untitled
        agents. Never an empty string. Sub-agents have no session of their own
        and never receive one.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSessionTitle
        id:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 200

    CacheTtlSeconds:
      description: Prompt-cache TTL classes, in seconds (5 minutes or 1 hour).
      type: integer
      enum: [300, 3600]

    AgentCache:
      description: |
        An estimate of the agent's prompt-cache clock, read from its transcript: the
        CLI's own cache state reaches neither hooks nor transcripts. `ttlSeconds` is
        the TTL class of the newest cache write (a turn that only read the cache
        keeps the previous class) and `expiresAt` (epoch ms) is that turn's first
        transcript line plus the TTL, so it trails the real clock by seconds, never
        by a TTL class. Both are present or both are absent; absent means unknown,
        never cold. Clients derive time left and cold from `expiresAt` against
        their own clock. Sent once per turn that moves the clock, as a clear when
        the agent moves to another transcript or its session ends, and on
        reconnect for every agent. Sub-agents never receive one.
      type: object
      additionalProperties: false
      required: [type, id]
      dependencies:
        ttlSeconds: [expiresAt]
        expiresAt: [ttlSeconds]
      properties:
        type:
          const: agentCache
        id:
          type: integer
        ttlSeconds:
          $ref: '#/components/schemas/CacheTtlSeconds'
        expiresAt:
          type: integer

    PermissionMode:
      description: Permission modes a session can run in.
      type: string
      enum: [default, acceptEdits, plan, auto, bypassPermissions, dontAsk]

    AgentMode:
      description: |
        The agent's permission mode, from the newest transcript record that states
        one. `mode` omitted means unknown. Sent when it changes, as a clear when the
        session ends for good, and on reconnect for every agent. A /clear or resume
        keeps it: the mode belongs to the CLI process, not to the transcript.
        Sub-agents never receive one.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentMode
        id:
          type: integer
        mode:
          $ref: '#/components/schemas/PermissionMode'

    AgentShells:
      description: |
        Background shells this server saw launch and not finish for the agent. A
        launch counts once its result carries a background task id; its task
        notification ends it. Not persisted: after a server restart it reads 0
        until the next launch. Zero after /clear, resume and session end. Sent when
        the count changes and on reconnect for every agent. Sub-agents never
        receive one.
      type: object
      additionalProperties: false
      required: [type, id, running]
      properties:
        type:
          const: agentShells
        id:
          type: integer
        running:
          type: integer
          minimum: 0

    TripwireSeverity:
      description: How loud a tripwire alarm is.
      type: string
      enum: [high, medium, low]

    AgentTripwire:
      description: |
        A detection rule fired on this agent's tool calls. `count` is every hit
        since the last `ackTripwire`; the rule shown is the highest severity seen
        since then. Carries only the rule's id and validated label, never the
        tool input that matched. Resent on reconnect while the alarm is set.
      type: object
      additionalProperties: false
      required: [type, id, ruleId, ruleName, severity, count]
      properties:
        type:
          const: agentTripwire
        id:
          type: integer
        ruleId:
          type: string
          maxLength: 64
        ruleName:
          type: string
          maxLength: 80
        severity:
          $ref: '#/components/schemas/TripwireSeverity'
        count:
          type: integer
          minimum: 1

    AgentTripwireClear:
      description: |
        The agent's alarm was acknowledged. Sent to every client, and on
        reconnect for every agent without an alarm so a missed ack does not
        leave a stale one.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTripwireClear
        id:
          type: integer

    RosterMood:
      description: |
        Derived from the member's state, never stored: `alarmed` while a tripwire is set,
        else `frustrated` after 3 failed tools in a row, else `happy` once it has earned
        XP from real work since its last failed tool, else `neutral`.
      type: string
      enum: [alarmed, frustrated, happy, neutral]

    AgentRoster:
      description: |
        The roster member this agent plays: a persistent identity whose XP and look
        survive restarts. Sent when the member is claimed, whenever XP, streak or mood
        change, and on reconnect for every agent that holds one. `xp` is the XP earned
        inside the current `level` and `xpToNext` is the whole span of that level, so
        the bar fraction is `xp / xpToNext`. Counts only: no titles, commands or paths.
      type: object
      additionalProperties: false
      required: [type, id, memberId, name, level, xp, xpToNext, streak, mood]
      properties:
        type:
          const: agentRoster
        id:
          type: integer
        memberId:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 40
        level:
          type: integer
          minimum: 1
        xp:
          type: integer
          minimum: 0
        xpToNext:
          type: integer
          minimum: 1
        streak:
          type: integer
          minimum: 0
        mood:
          $ref: '#/components/schemas/RosterMood'

    RosterEventKind:
      type: string
      enum: [xp, levelUp]

    RosterEventSignal:
      description: The real work an award pays for. The pop names it.
      type: string
      enum: [commit, pr, merge, tests]

    RosterEvent:
      description: |
        Transient hint for animations, one per award: this agent just earned `amount`
        XP for `signal` (`xp`), or earned it and reached `level` (`levelUp`, the only
        kind that carries `level`). Not resent on reconnect.
      type: object
      additionalProperties: false
      required: [type, id, kind]
      properties:
        type:
          const: rosterEvent
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/RosterEventKind'
        amount:
          type: integer
          minimum: 1
        level:
          type: integer
          minimum: 2
        signal:
          $ref: '#/components/schemas/RosterEventSignal'

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    CarpetTilesLoaded:
      description: Carpet auto-tile sprite sets (16 marching-squares pieces per variant).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: carpetTilesLoaded
        sets:
          type: array
          description: Array of carpet variants; each variant is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - ghostHeadlessAgents
        - showModelFlair
        - cozyLighting
        - hooksEnabled
        - hooksInfoShown
        - externalAssetDirectories
        - showAreas
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        ghostHeadlessAgents:
          type: boolean
        showModelFlair:
          type: boolean
        cozyLighting:
          type: boolean
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string
        showAreas:
          type: boolean

    HooksStatus:
      description: |
        Actual hook installation state, as opposed to the hooksEnabled
        preference in SettingsLoaded. The two can disagree: hooksEnabled
        defaults to true while first-run consent is still pending and nothing
        is installed yet. Sent after the connect handshake and whenever the
        install state changes (consent granted, settings toggle, uninstall).
      type: object
      additionalProperties: false
      required: [type, providerId, installed]
      properties:
        type:
          const: hooksStatus
        providerId:
          type: string
          description: >-
            The hook provider this install state is about (HookProvider.id,
            e.g. "claude"). Consumers keyed on install state must never mix
            one provider's status into another's — the Intro's install
            verdict in particular reads only the provider it asked about.
        installed:
          type: boolean

    HooksConsentRequest:
      description: |
        Ask this client to run the first-run hooks consent dialog. Sent during the
        `webviewReady` handshake when the hooks preference is on, consent has not
        been recorded, and nothing of ours is installed — and, in standalone, only
        on privileged (tokened) connections, since an untokened spectator could not
        act on it anyway (its `hooksConsentResponse` would be ignored).

        Carries the provider being asked about and its disclosure copy so the
        client renders the server's exact terms (the provider's
        consentDisclosure(), shared with no client-side duplicate to drift).
        The client answers with `hooksConsentResponse`, echoing the providerId;
        dismissing the dialog sends nothing and the request fires again on the
        next connect. One request per provider that needs an answer.
      type: object
      additionalProperties: false
      required: [type, providerId, headline, disclosure]
      properties:
        type:
          const: hooksConsentRequest
        providerId:
          type: string
          description: >-
            The hook provider whose install is being approved (HookProvider.id).
            The client never originates this value — it echoes it back in its
            `hooksConsentResponse`.
        headline:
          type: string
          description: One-sentence summary of what is being approved.
        disclosure:
          type: string
          description: |
            Full disclosure body (what is written, what data moves, how to undo),
            paragraphs separated by blank lines.

    AreaMappingsLoaded:
      description: |
        Workspace-folder-to-Area mappings. Folder names map to one or more Area
        labels; new agents from that folder prefer seats inside those Areas.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: areaMappingsLoaded
        mappings:
          type: object
          description: Map of folder name (string) to array of Area labels.
          additionalProperties:
            type: array
            items:
              type: string

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    WorkspaceFolders:
      description: Multi-root workspace folders (VS Code only).
      type: object
      additionalProperties: false
      required: [type, folders]
      properties:
        type:
          const: workspaceFolders
        folders:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFolder'

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    LaunchAgent:
      description: Launch a new Claude agent in a new terminal.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        folderPath:
          type: string
          description: Workspace folder path (for multi-root workspaces).
        bypassPermissions:
          type: boolean

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    AckTripwire:
      description: |
        Acknowledge the alarm on an agent. `count` is the hit count the client
        displayed; the server clears the alarm only if no newer hit arrived
        (otherwise it re-sends the current state).
      type: object
      additionalProperties: false
      required: [type, id, count]
      properties:
        type:
          const: ackTripwire
        id:
          type: integer
        count:
          type: integer
          minimum: 1

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: Save the office layout to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetGhostHeadlessAgents:
      description: >-
        Toggle translucent rendering for headless agents (adopted sessions with no
        terminal to focus).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setGhostHeadlessAgents
        enabled:
          type: boolean

    SetShowModelFlair:
      description: >-
        Toggle the model look: rarity colors, equipment and the companion that
        follow each agent's model tier.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowModelFlair
        enabled:
          type: boolean

    SetCozyLighting:
      description: >-
        Toggle the warm lighting pass: time-of-day tint over the map and the
        glows around lit monitors and lamps.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setCozyLighting
        enabled:
          type: boolean

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, providerId, enabled]
      properties:
        type:
          const: setHooksEnabled
        providerId:
          type: string
          description: >-
            The hook provider being toggled (HookProvider.id). The client
            echoes the id of the hooksStatus row the checkbox renders; it
            never originates one.
        enabled:
          type: boolean

    HooksConsentResponse:
      description: |
        The user's answer to `hooksConsentRequest` — an ABSOLUTE statement of
        the state the user wants, revisable from the Intro's closing step. Only
        an exact `install` grants consent and installs; only an exact `never`
        records a durable decline and persists hooks-off (uninstalling first
        when this provider's hooks are on disk from an earlier answer).
        `notNow` writes nothing on a fresh ask, but over anything an EARLIER
        answer left behind it reverts it — uninstalling a landed install,
        clearing a recorded grant or decline — so the ask genuinely returns on
        the next connect. Any unrecognized value writes NOTHING and the user is
        asked again — a malformed choice must never be read as approval, a
        durable decline, or an uninstall trigger. The server ignores this
        message on unprivileged standalone connections, which were never sent
        the request.
      type: object
      additionalProperties: false
      required: [type, providerId, choice]
      properties:
        type:
          const: hooksConsentResponse
        providerId:
          type: string
          description: >-
            The provider this answer is about, echoed verbatim from the
            `hooksConsentRequest` that solicited it. An id naming no
            registered provider is treated exactly like a junk choice:
            write nothing.
        choice:
          $ref: '#/components/schemas/HooksConsentChoice'

    HooksConsentChoice:
      description: >-
        The three consent outcomes. Receivers must treat any other value as a
        no-op: write nothing, ask again. (An exact notNow itself is a no-op
        only on a fresh ask — over an earlier answer it is a revision that
        undoes what that answer left behind.)
      type: string
      enum: [install, notNow, never]

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: >-
        Add an external asset directory. In VS Code the host shows a native
        directory picker and omits `path`; the standalone browser has no native
        picker, so it supplies an absolute `path` typed by the user.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory
        path:
          type: string
          description: Absolute directory path (standalone browser only; omitted in VS Code).

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    SaveAreaMappings:
      description: Persist folder-to-Area mappings for seat assignment.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: saveAreaMappings
        mappings:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    SetShowAreas:
      description: Toggle the Areas overlay (translucent rendering on top of the office).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowAreas
        enabled:
          type: boolean

    SetTokenBudgets:
      description: |
        Replace both token budgets (weighted tokens). A field left out means that budget is unset; the server
        ignores values that are not positive finite numbers. Answered with a fresh `tokenUsage`.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setTokenBudgets
        budget5h:
          type: number
        budgetWeek:
          type: number

    TokenUsage:
      description: |
        Token spend read from the CLI's transcripts, in cost-weighted tokens (input + 1.25 x cache-creation +
        0.1 x cache-read + 5 x output). `scanning: true` means the first pass is still running: no window or
        ranking is sent until it completes, since a partial total would read as the real one. `block` is absent
        when no 5-hour block contains the current time. Sent on connect and when the aggregate changes (at most
        every 30 s). `source: estimated` windows are derived from transcript timestamps; `quota` windows are
        anchored to a reset time the CLI itself reported. Percent fields exist only when that budget is set.
      type: object
      additionalProperties: false
      required: [type, generatedAt]
      properties:
        type:
          const: tokenUsage
        generatedAt:
          type: integer
          description: Epoch ms.
        scanning:
          type: boolean
        block:
          $ref: '#/components/schemas/TokenWindow'
        week:
          $ref: '#/components/schemas/TokenWindow'
        biggestBlock:
          type: number
          description: Largest 5-hour block total (weighted) among the last 7 days of records.
        budget5h:
          type: number
        budgetWeek:
          type: number

    TokenWindow:
      type: object
      additionalProperties: false
      required: [source, start, end, total, raw, byArea, bySession]
      properties:
        source:
          $ref: '#/components/schemas/TokenWindowSource'
        start:
          type: integer
          description: Epoch ms.
        end:
          type: integer
          description: Epoch ms.
        total:
          type: number
          description: Cost-weighted tokens.
        raw:
          type: number
          description: Plain sum of the four token counters.
        budgetPct:
          type: number
          description: total / budget, as a fraction. Only when this window's budget is set.
        byArea:
          type: array
          items:
            $ref: '#/components/schemas/TokenAreaTotal'
        bySession:
          type: array
          description: Top sessions by weighted total.
          items:
            $ref: '#/components/schemas/TokenSessionTotal'

    TokenWindowSource:
      description: '`quota` = anchored to a reset time the CLI reported; `estimated` = derived from transcript timestamps.'
      type: string
      enum: [quota, estimated]

    TokenAreaTotal:
      type: object
      additionalProperties: false
      required: [area, folder, total, raw]
      properties:
        area:
          type: [string, 'null']
          description: Area label, or null when the folder maps to none (shown under "Lobby").
        folder:
          type: string
        total:
          type: number
        raw:
          type: number
        share:
          type: number
          description: Fraction of the window total; omitted when that total is 0.
        budgetPct:
          type: number

    TokenSessionTotal:
      type: object
      additionalProperties: false
      required: [sessionId, area, folder, total, raw, models, rawModels]
      properties:
        sessionId:
          type: string
        title:
          type: string
        area:
          type: [string, 'null']
        folder:
          type: string
        total:
          type: number
        raw:
          type: number
        models:
          type: object
          description: Weighted total per model.
          additionalProperties:
            type: number
        rawModels:
          type: object
          description: Raw counters per model, [input, cache-creation, cache-read, output].
          additionalProperties:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type: number

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    # ── Supporting schemas ─────────────────────────────────────────

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    WorkspaceFolder:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer
